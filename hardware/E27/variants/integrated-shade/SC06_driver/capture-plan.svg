<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"><rect width="1400" height="840" fill="#f1f4f7"/><style>text{font-family:Arial,sans-serif;fill:#19334a} .h{font-size:30px;font-weight:bold}.t{font-size:21px}.s{font-size:18px}.b{fill:white;stroke:#46657e;stroke-width:2}.w{stroke:#376b83;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#376b83"/></marker></defs><text x="40" y="55" class="h">Velluneo SC06-B — plan polaczen przed schematem KiCad</text><text x="40" y="95" class="t">Zasilacz 230 V / 50 Hz | kondensator w bazie | bez zalozonego obrysu obudowy</text><rect class="b" x="40" y="145" width="260" height="150" rx="8"/><text x="55" y="177" class="t">Wejscie i filtr</text><text x="55" y="210" class="s">RF1 220 ohm, mostek</text><text x="55" y="235" class="s">C1 100 nF / 2 kV</text><text x="55" y="260" class="s">L1 10 mH, C2 330 nF</text><text x="55" y="285" class="s">TVS na szynie DC</text><rect class="b" x="365" y="145" width="295" height="150" rx="8"/><text x="380" y="177" class="t">Przetwornica buck</text><text x="380" y="210" class="s">LYT0006D-TL</text><text x="380" y="235" class="s">L2 + L3 = 3 mH</text><text x="380" y="260" class="s">R2 = 33,2 ohm</text><text x="380" y="285" class="s">D1 SiC 1200 V</text><rect class="b" x="735" y="145" width="250" height="150" rx="8"/><text x="750" y="177" class="t">Kondensator w bazie</text><text x="750" y="210" class="s">C5 150 uF / 160 V</text><text x="750" y="235" class="s">2 x 56 kohm rownolegle</text><text x="750" y="260" class="s">Cel: ponizej 40 s do 5 V</text><text x="750" y="285" class="s">takze przy 1 przerwie</text><rect class="b" x="1060" y="145" width="300" height="150" rx="8"/><text x="1075" y="177" class="t">Wyjscie LED</text><text x="1075" y="210" class="s">R7 470 ohm / 5 W</text><text x="1075" y="235" class="s">Panel okolo 55 mA</text><text x="1075" y="260" class="s">Propozycja 30 LED w szeregu</text><text x="1075" y="285" class="s">Wyjscie odniesione do sieci</text><path class="w" d="M300 215 L365 215"/><path class="w" d="M660 215 L735 215"/><path class="w" d="M985 215 L1060 215"/><rect class="b" x="735" y="390" width="335" height="145" rx="8"/><text x="750" y="422" class="t">Pomiar przepiecia</text><text x="750" y="455" class="s">TLV6700 + precyzyjny dzielnik</text><text x="750" y="480" class="s">Regulowane zasilanie okolo 12 V</text><text x="750" y="505" class="s">Zewnetrzna histereza</text><text x="750" y="530" class="s">Automatyczne ponowne wlaczenie</text><rect class="b" x="365" y="390" width="295" height="145" rx="8"/><text x="380" y="422" class="t">Wylaczenie sterownika</text><text x="380" y="455" class="s">PhotoMOS AQY221R2VY</text><text x="380" y="480" class="s">BP polaczone z SOURCE</text><text x="380" y="505" class="s">przez R6 100 ohm</text><text x="380" y="530" class="s">Bez zwarcia BP do masy</text><path class="w" d="M860 295L860 390"/><path class="w" d="M735 460L660 460"/><path class="w" d="M510 390L510 295"/><text x="40" y="615" class="t">Usuniety poprzedni tor SCR / D2: nie prowadzimy impulsu kondensatora przez pin BP.</text><text x="40" y="660" class="t">To mapa do zatwierdzenia. Nie jest schematem KiCad, projektem PCB ani dokumentacja produkcyjna.</text><text x="40" y="705" class="s">Ostateczna kwalifikacja wymaga sprawdzenia startu, temperatur, impulsow i zachowania przy uszkodzeniu elementu.</text><text x="40" y="750" class="s">BOM i pelna tabela fizycznych pinow sa dolaczone. Main pozostaje bez zmian.</text></svg>