<text x="110" y="201" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Diffuser allocation H39</text>
<line x1="380" y1="161" x2="380" y2="680" stroke="#64748b"/>
<line x1="375" y1="161" x2="385" y2="161" stroke="#64748b"/>
<line x1="375" y1="680" x2="385" y2="680" stroke="#64748b"/>
<text x="390" y="420.5" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">173</text>
<line x1="85" y1="146" x2="355" y2="146" stroke="#64748b"/>
<text x="196" y="138" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">90</text>
<text x="470" y="145" font-family="Arial,sans-serif" font-size="20" fill="#0f172a" font-weight="bold">Nominal axial stack</text>
<text x="470" y="180" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">28 cap + 45 driver (including primary heat island)</text>
<text x="470" y="208" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">8 barrier / thermal interfaces / adapter</text>
<text x="470" y="236" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">50 commercial cooler + 3 LED board + 39 diffuser</text>
<text x="470" y="264" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">= 173 mm total; tolerances and detailed fit remain open.</text>
<text x="470" y="325" font-family="Arial,sans-serif" font-size="20" fill="#0f172a" font-weight="bold">Thermal split in one declared hypothesis</text>
<text x="470" y="360" font-family="Arial,sans-serif" font-size="17" fill="#334155" font-weight="normal">4 W driver + 8 W light heat = 12 W total</text>
<text x="470" y="390" font-family="Arial,sans-serif" font-size="17" fill="#334155" font-weight="normal">Housing branch: about 3.53 W</text>
<text x="470" y="420" font-family="Arial,sans-serif" font-size="17" fill="#334155" font-weight="normal">Commercial cooler branch: about 8.47 W</text>
<text x="470" y="450" font-family="Arial,sans-serif" font-size="17" fill="#334155" font-weight="normal">Primary plate: about 65.35 C at 40 C ambient</text>
<text x="470" y="505" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Assumptions: housing h=3, emissivity 0.85, view factor 1;</text>
<text x="470" y="528" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">cooler degradation x1.25; primary interface 0.85 K/W.</text>
<text x="470" y="564" font-family="Arial,sans-serif" font-size="17" fill="#b45309" font-weight="bold">This is a solved model, not measured performance.</text>
<text x="470" y="593" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Zero-convection / lower-view-factor sensitivity is recorded separately.</text>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="20" fill="#0f172a" font-weight="bold">Material / barrier section</text>
<text x="40" y="772" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Primary island -&gt; TIM -&gt; AM997 ceramic -&gt; TIM -&gt; secondary adapter -&gt; cooler + metal housing</text>
<text x="40" y="800" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Four secondary-domain aluminium necks: each width &gt;=5, thickness &gt;=3, length &lt;=4 mm.</text>
<text x="40" y="828" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Outer housing OD90 / ID84 / H45; inner primary cover OD82 / proposed wall3; no metal crosses the ceramic.</text>
<text x="40" y="856" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Board box66 x32 x23 is an allocation only. Actual components, insulation paths, carrier/clamp strength and fit are not verified.</text>
<text x="40" y="884" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">Coating properties, thermal contacts, real orientations/fixtures, capacitor core and LED junction temperatures remain open.</text>
<text x="40" y="912" font-family="Arial,sans-serif" font-size="14" fill="#334155" font-weight="normal">DESIGN-CLOSURE-02  |  Dimensioned engineering proposal  |  Not a product rendering, stage approval or manufacturing drawing</text>
</svg>
