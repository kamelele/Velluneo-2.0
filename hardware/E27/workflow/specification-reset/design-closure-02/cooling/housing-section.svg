<text x="40" y="45" font-family="Arial,sans-serif" font-size="24" fill="#0f172a" font-weight="bold">C2b — SECONDARY HOUSING AS AN ADDITIONAL HEAT PATH</text>
<text x="40" y="77" font-family="Arial,sans-serif" font-size="16" fill="#334155" font-weight="normal">Proposed envelope: diameter 90 mm x full height 173 mm. Unbuilt / no owner selection / no PCB placement.</text>
