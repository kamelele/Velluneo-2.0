<text x="740" y="850" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">Important limits</text>
<text x="740" y="879" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">• No metal bolt crosses the ceramic barrier.</text>
<text x="740" y="905" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">• Adapter and covers may degrade natural convection.</text>
<text x="740" y="931" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">• 1.25 multiplier is a sensitivity, not an orientation guarantee.</text>
<text x="740" y="957" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">• Plate temperature does not prove C1 core or LED junction temperature.</text>
<text x="740" y="983" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">• Housing, insulation and detailed component fit remain unapproved.</text>
<text x="42" y="1030" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">* E27 silhouette is a reserved envelope, not a qualified cap/interface drawing. Height includes cap and diffuser.</text>
<text x="42" y="1054" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="normal">C3 passes only this declared thermal screen. A 60 mm design is not universally ruled out; the smooth-shell comparison is limited.</text>
<text x="42" y="1080" font-family="Arial, sans-serif" font-size="13" fill="#475569" font-weight="normal">DESIGN-CLOSURE-02  |  Native supplier data + proposed interface geometry  |  No measurements / no PCB release</text>
