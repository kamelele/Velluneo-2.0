<text x="493" y="245" class="detail">Trzy styki sprężynujące. Przesłonę otwiera klucz wkładu.</text>

<path d="M339 291 H480" class="call"/>
<circle cx="339" cy="291" r="4" class="accent"/>
<text x="493" y="286" class="label">MCPCB, uchwyt i suchy TIM</text>
<text x="493" y="308" class="detail">Ścięcie pozycjonuje wkład. Obrzeże przenosi docisk.</text>

<path d="M364 351 H480" class="call"/>
<circle cx="364" cy="351" r="4" class="accent"/>
<text x="493" y="347" class="label">Radiator Ø48–54 za osłoną</text>
<text x="493" y="369" class="detail">Sprawdzić dostęp do metalu i temperaturę chwytu.</text>

<path d="M353 400 H480" class="call"/>
<circle cx="353" cy="400" r="4" class="accent"/>
<text x="493" y="397" class="label">Stała przegroda izolacyjna</text>
<text x="493" y="419" class="detail">Osłania komorę sieciową także przy zdjętym kloszu.</text>

<line x1="493" y1="452" x2="1065" y2="452" stroke="#c6d1d6"/>
<text x="493" y="485" class="label">Kolejność przy otwieraniu</text>
<circle cx="506" cy="518" r="12" fill="#d7ece9"/><text x="506" y="523" text-anchor="middle" class="detail">1</text>
<text x="528" y="523" class="detail">S1 wyłącza sterowanie wyjścia.</text>
<circle cx="506" cy="548" r="12" fill="#d7ece9"/><text x="506" y="553" text-anchor="middle" class="detail">2</text>
<text x="528" y="553" class="detail">S2 rozłącza dodatni tor zasilania.</text>
<circle cx="506" cy="578" r="12" fill="#d7ece9"/><text x="506" y="583" text-anchor="middle" class="detail">3</text>
<text x="528" y="583" class="detail">Zwalnia się docisk i można wyjąć wkład za obrzeże.</text>
<text x="36" y="614" class="sub">Rev A · Schemat konstrukcji · Osłona, krzywki i uchwyt wymagają rysunków wykonawczych oraz prób.</text>
